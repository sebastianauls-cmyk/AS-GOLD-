name: ASH Production Guest Smoke

on:
  # One controlled push trigger is used for the current production acceptance.
  # It is restricted to this workflow file and removed again after the run.
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-guest-smoke.yml'
  # Live sign-in consumes an approved anonymous test slot (20 per rolling 24h).
  # Git pushes are already checked by CI/browser tests; never exhaust production
  # guest capacity by launching this live test on every code or SQL change.
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ash-production-guest-smoke
  cancel-in-progress: true

jobs:
  production-guest-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: tests/browser
    env:
      ASH_BROWSER_BASE_URL: https://app-gold-workspace.vercel.app
      ASH_BROWSER_LOCAL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install isolated browser dependencies
        run: npm ci
      - name: Run production guest smoke
        run: npx playwright test specs/production-guest-smoke.spec.js --project=desktop-chromium
      - name: Save production smoke artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ASH-production-guest-smoke-${{ github.run_id }}
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          if-no-files-found: warn
          retention-days: 14
