name: ASH Production Guest Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-guest-smoke.yml'
      - 'tests/browser/specs/production-guest-smoke.spec.js'
      - 'app/modules/auth/**'
      - 'app/modules/workspace/**'
      - 'app/modules/cases/**'
      - 'app/modules/services/**'
      - 'supabase/migrations/**'
  schedule:
    # The DB grants at most 20 anonymous-test signups per rolling 24h. Avoid exhausting that shared safety cap.
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ash-production-guest-smoke
  cancel-in-progress: true

jobs:
  production-guest-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: tests/browser
    env:
      ASH_BROWSER_BASE_URL: https://app-gold-workspace.vercel.app
      ASH_BROWSER_LOCAL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install isolated browser dependencies
        run: npm ci
      - name: Run production guest smoke
        # One real production guest only; mobile flows are covered by isolated local E2E tests.
        # Retries would create additional guest identities and exhaust the 20/24h safety cap.
        run: npx playwright test specs/production-guest-smoke.spec.js --project=desktop-chromium --workers=1 --retries=0
      - name: Save production smoke artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ASH-production-guest-smoke-${{ github.run_id }}
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          if-no-files-found: warn
          retention-days: 14
