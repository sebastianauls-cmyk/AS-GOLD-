name: V46 Transaction Service Extraction

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-transaction-services.yml'
      - 'scripts/v46_extract_transaction_services.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-services:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1

      - name: Extract transactional services
        run: node scripts/v46_extract_transaction_services.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run full regression chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Commit verified transactional boundaries
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No service changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/workspace/WorkspaceApp.js \
                  app/modules/services/pricingRepository.js \
                  app/modules/services/complianceRepository.js \
                  app/modules/services/documentRepository.js \
                  app/modules/services/approvalRepository.js \
                  app/modules/README.md \
                  scripts/test_v46_modular_boundaries.mjs
          git commit -m 'V46 extract transactional service boundaries'
          git push origin HEAD:v46-navigation-clean
