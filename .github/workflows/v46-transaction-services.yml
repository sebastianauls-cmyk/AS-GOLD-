name: V46 Transaction Service Extraction

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-transaction-services.yml'
      - 'scripts/v46_extract_transaction_services.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-services:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1

      - name: Harden migration function boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/v46_extract_transaction_services.mjs')
          source=path.read_text()
          old="""function replaceFunction(startName,nextName,replacement){
            const start=`  async function ${startName}`
            const next=`\\n  async function ${nextName}`
            const startIndex=source.indexOf(start)
            const nextIndex=source.indexOf(next,startIndex)
            if(startIndex<0||nextIndex<0) throw new Error(`Could not isolate ${startName}`)
            source=source.slice(0,startIndex)+replacement+source.slice(nextIndex)
          }"""
          new="""function replaceFunction(startName,nextName,replacement){
            const start=`  async function ${startName}`
            const startIndex=source.indexOf(start)
            const nextCandidates=[
              source.indexOf(`\\n  async function ${nextName}`,startIndex),
              source.indexOf(`\\n  function ${nextName}`,startIndex)
            ].filter(index=>index>=0)
            const nextIndex=nextCandidates.length?Math.min(...nextCandidates):-1
            if(startIndex<0||nextIndex<0) throw new Error(`Could not isolate ${startName}`)
            source=source.slice(0,startIndex)+replacement+source.slice(nextIndex)
          }"""
          if old not in source:
              raise SystemExit('replaceFunction helper anchor missing')
          path.write_text(source.replace(old,new))
          PY

      - name: Extract transactional services
        run: node scripts/v46_extract_transaction_services.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run full regression chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Commit verified transactional boundaries
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No service changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/workspace/WorkspaceApp.js \
                  app/modules/services/pricingRepository.js \
                  app/modules/services/complianceRepository.js \
                  app/modules/services/documentRepository.js \
                  app/modules/services/approvalRepository.js \
                  app/modules/README.md \
                  scripts/test_v46_modular_boundaries.mjs \
                  scripts/v46_extract_transaction_services.mjs
          git commit -m 'V46 extract transactional service boundaries'
          git push origin HEAD:v46-navigation-clean
