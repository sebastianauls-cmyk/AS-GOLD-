name: V46 Workspace Repository Extraction

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-workspace-repository.yml'

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply repository extraction
        run: node scripts/v46_extract_workspace_repository.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run regression chain and capture diagnostics
        id: regression
        shell: bash
        run: |
          set +e
          npm run prebuild > /tmp/v46-prebuild.log 2>&1
          code=$?
          cat /tmp/v46-prebuild.log
          if [ "$code" -ne 0 ]; then
            mkdir -p docs
            tail -n 200 /tmp/v46-prebuild.log > docs/V46_REPOSITORY_TEST_FAILURE.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Commit failure diagnostics
        if: steps.regression.outputs.failed == 'true'
        run: |
          set -euo pipefail
          git restore app/modules/workspace/WorkspaceApp.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/V46_REPOSITORY_TEST_FAILURE.log
          git commit -m 'V46 repository extraction test diagnostics'
          git pull --rebase origin v46-navigation-clean
          git push origin HEAD:v46-navigation-clean
      - name: Stop after failed regression
        if: steps.regression.outputs.failed == 'true'
        run: exit 1
      - name: Build production bundle
        if: steps.regression.outputs.failed == 'false'
        run: npx next build
      - name: Commit verified repository boundary
        if: steps.regression.outputs.failed == 'false'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/workspace/WorkspaceApp.js
          git commit -m 'V46 extract workspace repository boundary'
          git pull --rebase origin v46-navigation-clean
          git push origin HEAD:v46-navigation-clean
