name: V46 Final Modular Release Candidate

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-final-release-candidate.yml'
      - 'scripts/v46_finalize_release_candidate.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-release-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch with history
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Synchronize latest main history while preserving verified modular tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "SYNCED_MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          git merge -s ours --no-ff origin/main -m 'V46 synchronize latest main history after modular parity'

      - name: Prepare final release candidate
        run: node scripts/v46_finalize_release_candidate.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run complete regression and release-gate chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Ensure main did not advance during validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_MAIN_SHA" != "$SYNCED_MAIN_SHA" ]; then
            echo "main advanced during validation; refusing to publish release candidate"
            exit 1
          fi

      - name: Commit and publish only fully verified release candidate
        shell: bash
        run: |
          set -euo pipefail
          git add app/testen/page.js \
                  app/modules/tester/TesterGuide.js \
                  app/modules/tester/TesterShareButton.js \
                  app/modules/compliance/LegalDocument.js \
                  scripts/test_v38_tester_guide.mjs \
                  scripts/test_v46_modular_boundaries.mjs \
                  scripts/test_v46_release_gate.mjs \
                  scripts/test_v70_tester_sharing.mjs \
                  package.json \
                  docs/APP_GOLD_MODULARISIERUNG_V46.md
          git commit -m 'V46 finalize modular release candidate and tester gate'
          git push origin HEAD:v46-navigation-clean
