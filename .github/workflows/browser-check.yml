name: ASH Public Browser Check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/browser-check.yml'
      - 'tests/browser/**'
      - 'app/modules/public/**'
      - 'app/entdecken/**'
      - 'app/modules/cases/**'
      - 'app/modules/documents/**'
      - 'app/modules/workspace/**'
      - 'app/modules/services/**'
      - 'app/globals.css'
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-check.yml'
      - 'tests/browser/**'
      - 'app/modules/public/**'
      - 'app/entdecken/**'
      - 'app/modules/cases/**'
      - 'app/modules/documents/**'
      - 'app/modules/workspace/**'
      - 'app/modules/services/**'
      - 'app/globals.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ash-public-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/browser
    env:
      ASH_BROWSER_BASE_URL: https://app-gold-workspace.vercel.app
      ASH_BROWSER_LOCAL: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install isolated browser test dependencies
        run: npm ci
      - name: Build proposed application for pull-request verification
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: .
        run: |
          npm ci
          node tests/browser/create-case-fixture.mjs
          npm run build
      - name: Install independent Chromium and WebKit browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Check the proposed application or published production page
        run: npm test
      - name: Save screenshots and browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ASH-public-browser-${{ github.run_id }}
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          if-no-files-found: warn
          retention-days: 14
