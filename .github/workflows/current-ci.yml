name: ASH Workspace Gold Current CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify complete primary-source refresh
        run: python3 scripts/test_primary_refresh_atomicity.py
      - name: Run current release gates
        run: npm run prebuild
      - name: Build production bundle
        run: npm run build
  pdf-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.14
      - name: Cache pinned serverless PDF dependency
        run: |
          deno cache --no-config --lock=scripts/offline/pdf-deno.lock scripts/test_primary_pdf_sources.mjs
          git diff --exit-code -- scripts/offline/pdf-deno.lock
      - name: Verify real PDF extraction without network permission
        run: deno run --no-config --cached-only --lock=scripts/offline/pdf-deno.lock scripts/test_primary_pdf_sources.mjs
      - name: Observe public source availability (separate from offline acceptance)
        run: deno run --no-config --cached-only --lock=scripts/offline/pdf-deno.lock --allow-net=juris.bundesgerichtshof.de,www.bundesgerichtshof.de,testphase.rechtsinformationen.bund.de scripts/probe_official_pdf_sources.mjs
