name: ASH Workspace Gold Current CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify complete primary-source refresh
        run: |
          python3 scripts/test_primary_refresh_atomicity.py
          node --import ./scripts/offline/noNetwork.mjs scripts/test_primary_source_transport.mjs
      - name: Run current release gates
        run: npm run prebuild
      - name: Build production bundle
        run: npm run build
