name: V46 Export Service Extraction

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-export-service.yml'
      - 'scripts/v46_extract_export_service.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-export-service:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1
      - name: Extract export service
        run: node scripts/v46_extract_export_service.mjs
      - name: Align legacy export guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/test_v37_end_to_end.mjs')
          source=path.read_text()
          anchor="const workspaceRepository=fs.readFileSync('app/modules/services/workspaceRepository.js','utf8')"
          line="const exportService=fs.readFileSync('app/modules/services/exportService.js','utf8')"
          if line not in source:
              if anchor not in source:
                  raise SystemExit('export service read anchor missing')
              source=source.replace(anchor,anchor+'\n'+line)
          source=source.replace("mustContain(page,'function downloadBlob','download delivery')","mustContain(exportService,'function downloadExportArtifact','download delivery service')")
          path.write_text(source)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run full regression chain
        run: npm run prebuild
      - name: Build production bundle
        run: npx next build
      - name: Commit verified export boundary
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/workspace/WorkspaceApp.js app/modules/services/exportService.js app/modules/README.md scripts/test_v46_modular_boundaries.mjs scripts/test_v37_end_to_end.mjs
          git commit -m 'V46 extract export service boundary'
          git push origin HEAD:v46-navigation-clean
