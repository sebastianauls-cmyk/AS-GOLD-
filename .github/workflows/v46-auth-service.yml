name: V46 Auth Service Extraction

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-auth-service.yml'
      - 'scripts/v46_extract_auth_service.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-auth-service:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1

      - name: Extract auth service
        run: node scripts/v46_extract_auth_service.mjs

      - name: Align legacy E2E auth guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/test_v37_end_to_end.mjs')
          source=path.read_text()
          repo_line="const workspaceRepository=fs.readFileSync('app/modules/services/workspaceRepository.js','utf8')"
          auth_line="const authRepository=fs.readFileSync('app/modules/services/authRepository.js','utf8')"
          if auth_line not in source:
              if repo_line not in source:
                  raise SystemExit('auth repository guard import anchor missing')
              source=source.replace(repo_line, repo_line+'\n'+auth_line)
          source=source.replace("mustContain(page,'signInWithPassword','password login')","mustContain(authRepository,'signInWithPassword','password login service')")
          source=source.replace("mustContain(page,'auth.signUp','registration action')","mustContain(authRepository,'auth.signUp','registration service action')")
          path.write_text(source)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run full regression chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Commit verified auth boundary
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No auth changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/workspace/WorkspaceApp.js \
                  app/modules/services/authRepository.js \
                  app/modules/README.md \
                  scripts/test_v46_modular_boundaries.mjs \
                  scripts/test_v37_end_to_end.mjs
          git commit -m 'V46 extract auth service boundary'
          git push origin HEAD:v46-navigation-clean
