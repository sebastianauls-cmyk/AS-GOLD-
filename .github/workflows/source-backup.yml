name: AS Gold Source Backup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Persist German explainer master videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/videos

          if [ ! -s public/videos/as-gold-explainer-de-male.mp4 ]; then
            curl --fail --location --retry 3 --output public/videos/as-gold-explainer-de-male.mp4 'https://files2.heygen.ai/aws_pacific/avatar_tmp/969e7dea31614703a4c738c751f0195f/a9f64e0a49d407631331eb59ac9d7ae0.mp4?Expires=1788811447&Signature=IU~7E2J0FxNmWDwMhQaYv6KHNTT3MbKjnmQOt-7AIz~G26QT6po2PDg3tgtdHPEU9jP3E9juOvZ29M6r4DGQ7G6Yb8NRBa2yEEzaGIbgk4pJjAife7w-uUsU-aBcULvq1hulI1hWnWS1dPs34TRirikD7h~67My90eAIiRwjeMjP1GXaHXTHtjQI7sbvSOVbe8S3laOcXxltSrA2qD4B5pUkHxqvM8keM-loO9MsNjkdPoBgWDgSU7qHfzBHKGM8pYczQ5X8qG4DJA3SMwboIDKyhuSV5OeEl-aVuRdFlpLMisxM4ZRqDqorf0ZySL7Ydtuef-rZOegih3qy4BJBAw__&Key-Pair-Id=K38HBHX5LX3X2H'
          fi

          if [ ! -s public/videos/as-gold-explainer-de-female.mp4 ]; then
            curl --fail --location --retry 3 --output public/videos/as-gold-explainer-de-female.mp4 'https://files2.heygen.ai/aws_pacific/avatar_tmp/969e7dea31614703a4c738c751f0195f/8c396922b110ea1a7a59411a8d8e1fa5.mp4?Expires=1788811604&Signature=RnGhwBkMar1aRLlWpBZiTgwP3h1v88ui~7PiEZ6Y749UqGprJ3kpFFBGeB01e1jj0ueq3BizEtSdZA2txmct5erxXGJ6OZZMyTnr3Ni8z6hMS0b57KXAlKDBy2FFiNp2~LXHk4nK3U7isPFP5PYdSqgnGHdCUwsxdWjCLwMTHBZqQ6rrDZlwDgWqLxOe8PijtH1I5cryEYtPpzaat7JoS6ZGjB0pAYMrX7Eqoqe0y5yuQfGXHX4nFN4jfh7S01YpCEEH5JVtHLyBfardRvF8FIpbaVGj7LW56usa6Crbi8g82cBh8ea5gF9CkP4YfQTA6NtRQXOC3PaLDRrQdFmPHw__&Key-Pair-Id=K38HBHX5LX3X2H'
          fi

          if [ -n "$(git status --porcelain -- public/videos)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/videos
            git commit -m 'Store German explainer master videos permanently'
            git push
          fi

      - name: Create source archive
        run: |
          zip -r AS-Gold-Quellcode-${GITHUB_SHA}.zip . -x '.git/*'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: AS-Gold-Quellcode-${{ github.sha }}
          path: AS-Gold-Quellcode-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 90
