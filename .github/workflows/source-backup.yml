name: AS Workspace Gold Source Backup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Stage Drive-ready source archive contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backup-source
          mkdir -p backup-source
          rsync -a ./ backup-source/ \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'backup-source/' \
            --exclude 'AS-Workspace-Gold-*.zip'
          printf '%s\n' "${GITHUB_SHA}" > backup-source/BACKUP_COMMIT_SHA.txt
          printf '%s\n' "V80" > backup-source/APP_RELEASE.txt

      - name: Upload direct Drive-ready source artifact
        uses: actions/upload-artifact@v4
        with:
          name: AS-Workspace-Gold-V80-Drive-Direkt-${{ github.sha }}
          path: backup-source/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Create Drive-friendly source archive
        run: |
          zip -r AS-Workspace-Gold-V80-Quellcode-${GITHUB_SHA}.zip . \
            -x '.git/*' \
               'node_modules/*' \
               '.next/*' \
               'backup-source/*' \
               'AS-Workspace-Gold-*.zip'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: AS-Workspace-Gold-V80-Quellcode-${{ github.sha }}
          path: AS-Workspace-Gold-V80-Quellcode-${GITHUB_SHA}.zip
          if-no-files-found: error
          retention-days: 90
