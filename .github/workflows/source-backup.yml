name: AS Workspace Gold Source Backup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Stage Drive-ready V80 source backup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backup-source
          mkdir -p backup-source
          rsync -a ./ backup-source/ \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'public/videos/' \
            --exclude 'backup-source/' \
            --exclude 'AS-Workspace-Gold-*.zip'
          printf '%s\n' "${GITHUB_SHA}" > backup-source/BACKUP_COMMIT_SHA.txt
          printf '%s\n' "V80" > backup-source/APP_RELEASE.txt
          printf '%s\n' "Large explainer videos are intentionally excluded from this source archive; their references remain in the repository." > backup-source/VIDEO_BACKUP_NOTE.txt

      - name: Upload Drive-ready V80 source backup
        uses: actions/upload-artifact@v4
        with:
          name: AS-Workspace-Gold-V80-Quellcode-${{ github.sha }}
          path: backup-source/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
