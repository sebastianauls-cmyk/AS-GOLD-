name: V71 Direct Microphone Activation

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v71-direct-microphone.yml'
      - 'scripts/v71_preserve_direct_microphone_activation.mjs'
      - 'scripts/test_v71_direct_microphone_activation.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direct-microphone:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1

      - name: Preserve direct microphone activation
        run: node scripts/v71_preserve_direct_microphone_activation.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run complete regression chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Commit verified direct microphone path
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No microphone-path changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/public/PublicLanding.js app/modules/public/ProblemNavigator.js package.json
          git commit -m 'V71 preserve direct microphone activation in modular flow'
          git push origin HEAD:v46-navigation-clean
