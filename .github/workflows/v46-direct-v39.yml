name: V46 Direct V39 Case Intelligence

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-direct-v39.yml'
      - 'scripts/v46_direct_v39_case_intelligence.mjs'
      - 'scripts/v46_fix_v39_syntax.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direct-v39:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1

      - name: Replace global V39 DOM enhancer
        run: node scripts/v46_direct_v39_case_intelligence.mjs

      - name: Normalize generated date syntax
        run: node scripts/v46_fix_v39_syntax.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run full regression chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Commit verified direct V39
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No V39 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/cases/V39CaseTimelineAutoAssessment.js \
                  app/modules/cases/V24Workspace.js \
                  app/layout.js \
                  app/modules/README.md \
                  scripts/test_v39_case_intelligence.mjs \
                  scripts/test_v46_modular_boundaries.mjs
          git commit -m 'V46 render V39 case intelligence directly'
          git push origin HEAD:v46-navigation-clean
