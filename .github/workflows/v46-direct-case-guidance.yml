name: V46 Direct Case Guidance

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-direct-case-guidance.yml'
      - 'scripts/v46_direct_case_guidance.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direct-case-guidance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1

      - name: Replace global V38 guidance DOM enhancers
        run: node scripts/v46_direct_case_guidance.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run full regression chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Commit verified direct case guidance
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No case-guidance changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/cases/V38AssessmentExplainability.js \
                  app/modules/cases/V38PrimaryNextStep.js \
                  app/modules/cases/V24Workspace.js \
                  app/layout.js \
                  app/modules/README.md \
                  scripts/test_v38_assessment_explainability.mjs \
                  scripts/test_v38_primary_next_step.mjs \
                  scripts/test_v38_synthetic_full_flow.mjs \
                  scripts/test_v46_modular_boundaries.mjs
          git commit -m 'V46 render case guidance directly'
          git push origin HEAD:v46-navigation-clean
