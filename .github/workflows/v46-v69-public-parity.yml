name: V46 Modular Public V59-V69 Parity

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-v69-public-parity.yml'
      - 'scripts/v46_port_v69_modular_public_parity.mjs'
      - 'scripts/v46_sync_public_regression_guards.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1

      - name: Fetch current production branch for copy parity
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Port current public behavior into modular structure
        run: node scripts/v46_port_v69_modular_public_parity.mjs

      - name: Align regression guards with direct module ownership
        run: node scripts/v46_sync_public_regression_guards.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run full regression chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Commit only verified modular parity changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No modular public parity changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/public/PublicLanguageModules.js \
                  app/modules/public/PublicLanding.js \
                  app/modules/public/V37FirstAction.js \
                  app/modules/public/ProblemNavigator.js \
                  app/modules/public/ProductIntroCompact.js \
                  app/modules/public/HeroTitleStabilizer.js \
                  app/modules/public/asGoldIntroCopy.mjs \
                  app/modules/workspace/WorkspaceApp.js \
                  app/globals.css \
                  scripts/test_v34_customer_path.mjs \
                  scripts/test_v69_modular_public_parity.mjs \
                  package.json \
                  docs/APP_GOLD_MODULARISIERUNG_V46.md
          git commit -m 'V46 port current public V59-V69 behavior into modules'
          git push origin HEAD:v46-navigation-clean
