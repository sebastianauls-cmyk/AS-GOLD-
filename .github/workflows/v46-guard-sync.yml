name: V46 Sync Modular Guard

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-guard-sync.yml'

permissions:
  contents: write

jobs:
  sync-guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1
      - name: Align microphone assertion with modular implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_v46_modular_boundaries.mjs')
          s=p.read_text()
          s=s.replace("assert.match(currentMicrophone,/rec\\.onaudiostart/)","assert.match(currentMicrophone,/recognition\\.onaudiostart/)")
          p.write_text(s)
          PY
      - name: Commit guard alignment
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test_v46_modular_boundaries.mjs
          git commit -m 'V46 align microphone modular guard'
          git push origin HEAD:v46-navigation-clean
