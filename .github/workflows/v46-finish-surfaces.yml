name: V46 Finish Workspace Surfaces

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-finish-surfaces.yml'
      - 'scripts/v46_finish_workspace_surfaces.mjs'
      - 'scripts/test_v46_modular_boundaries.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish-surfaces:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1

      - name: Extract remaining workspace surfaces
        run: node scripts/v46_finish_workspace_surfaces.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run full regression chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Commit verified workspace surfaces
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No surface changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/workspace/WorkspaceApp.js \
                  app/modules/workspace/DashboardSurface.js \
                  app/modules/cases/WorkspaceCaseSurfaces.js \
                  app/modules/cases/ApprovalsSurface.js \
                  app/modules/documents/DocumentsSurface.js \
                  app/modules/pricing/UpgradePanel.js \
                  app/modules/compliance/AccountControlPanel.js
          git commit -m 'V46 finish protected workspace surface boundaries'
          git push origin HEAD:v46-navigation-clean

# Validation trigger: rerun full V46 regression and production build after tester-guide reopening.
