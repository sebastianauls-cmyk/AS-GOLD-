name: V46 Workspace Session Audit Split

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-workspace-session-audit.yml'
      - 'scripts/v46_extract_workspace_session_audit.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-session-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1

      - name: Extract session and audit ownership
        run: node scripts/v46_extract_workspace_session_audit.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused boundary guard
        run: node scripts/test_v46_workspace_session_audit.mjs

      - name: Run modular and navigation guards
        run: |
          npm run test:v46-controller
          npm run test:v46-modules
          npm run test:v46-direct-imports
          npm run test:v38-mobile
          npm run test:v44-language-order
          npm run test:v45-output-language

      - name: Run full regression chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Commit only verified controller reduction
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No session/audit split changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/workspace/WorkspaceAppV2.js \
                  app/modules/workspace/useWorkspaceAudit.js \
                  app/modules/workspace/useWorkspaceSession.js \
                  scripts/test_v46_workspace_session_audit.mjs \
                  app/modules/README.md \
                  docs/APP_GOLD_MODULARISIERUNG_V46.md
          git commit -m 'V46 extract workspace session and audit boundaries'
          git push origin HEAD:v46-navigation-clean
