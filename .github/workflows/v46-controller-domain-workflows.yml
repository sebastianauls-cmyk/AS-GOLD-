name: V46 Controller Domain Workflows

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-controller-domain-workflows.yml'
      - 'scripts/v46_wire_controller_workflows.mjs'
      - 'scripts/v46_align_public_modular_guard.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-controller-workflows:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1

      - name: Wire domain workflows into active controller
        run: node scripts/v46_wire_controller_workflows.mjs

      - name: Align public modular ownership guard
        run: node scripts/v46_align_public_modular_guard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run controller and modular guards
        run: |
          npm run test:v46-controller
          npm run test:v46-modules
          npm run test:v46-direct-imports
          npm run test:v38-mobile
          npm run test:v44-language-order
          npm run test:v45-output-language

      - name: Run full regression chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Commit only verified controller delegation
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No controller workflow changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/workspace/WorkspaceAppV2.js \
                  scripts/test_v46_controller_workflows.mjs \
                  scripts/test_v46_modular_boundaries.mjs \
                  docs/APP_GOLD_MODULARISIERUNG_V46.md
          git commit -m 'V46 delegate auth pricing and account controller workflows'
          git push origin HEAD:v46-navigation-clean
