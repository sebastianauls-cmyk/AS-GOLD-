name: V46 Workspace Direct Imports

on:
  push:
    branches: [v46-navigation-clean]
    paths:
      - '.github/workflows/v46-workspace-direct-imports.yml'
      - 'scripts/v46_cleanup_workspace_imports.mjs'
      - 'scripts/test_v46_workspace_direct_imports.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direct-imports:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: v46-navigation-clean
          fetch-depth: 1

      - name: Replace workspace compatibility imports
        run: node scripts/v46_cleanup_workspace_imports.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run complete regression chain
        run: npm run prebuild

      - name: Build production bundle
        run: npx next build

      - name: Commit verified canonical imports
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No workspace import cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/workspace/WorkspaceApp.js package.json
          git commit -m 'V46 use canonical domain imports in WorkspaceApp'
          git push origin HEAD:v46-navigation-clean
